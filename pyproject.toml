[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-context"
version = "0.1.0"
description = "Insurance enterprise context layer: layered ontology (core -> line pack -> client -> unit), governed views, metrics, drift-driven evolution and agent tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tiger Analytics", email = "engineering@tigeranalytics.com" }]
# Runtime (resolution, views, metrics, validation, drift, agent tools) stays light so
# the context layer can be embedded in any app; the full LinkML generator stack is
# only needed to export OWL / SHACL / JSON Schema / Pydantic.
dependencies = [
    "linkml-runtime>=1.8",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
export = ["linkml>=1.9", "rdflib>=7.0"]
agent = ["langgraph>=0.6", "langchain-openai>=0.3"]  # the agent runtime; any OpenAI-compatible endpoint
# Context Studio: the review app over git (API + curator + chat). GitLab support is optional.
studio = ["insurance-context[agent]", "fastapi>=0.115", "uvicorn>=0.30", "ruamel.yaml>=0.18"]
gitlab = ["python-gitlab>=4.0"]
powerbi = ["pbixray>=0.15"]  # reads the compressed model inside a .pbix
databricks = ["databricks-sql-connector>=3.0", "databricks-sdk>=0.20"]  # captured Power BI metrics on Databricks (OAuth M2M via the SDK)
mcp = ["mcp>=1.30,<2", "PyJWT[crypto]>=2.8", "uvicorn>=0.30"]  # ictx pbi serve: the metrics as an MCP server (OIDC bearer JWTs)

[project.scripts]
ictx = "insurance_context.cli:main"
ctx-studio = "context_studio.cli:main"
pbi-metrics = "insurance_context.cli:pbi_main"  # `ictx pbi ...` under its own name

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_context", "src/context_studio"]

[dependency-groups]
dev = ["pytest>=8.0", "linkml>=1.9", "rdflib>=7.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
